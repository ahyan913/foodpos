name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: 'Deploy to staging?'
        required: true
        default: 'No'
      
  push:
    branches:
      - main
jobs:
  confirm: 
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps: 
      - name: Confirm deploy
        if: inputs.deploy_staging == 'Yes'
        run: 'echo Hello'

  deploy:
  
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to Main 
        if: steps.build.outcome == 'success'
        run: |
          cd /var/www/foodpos.yanlui.com;
          git checkout main;
          git pull origin main;
          composer install;
          php artisan config:clear;
          php artisan migrate;
          php artisan optimize;
          npm ci;
          npm run build;


        
        
